<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernhill trace review</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2321;--mute:#5d6662;--line:#dcd9d0;--pass:#1f7a4d;--fail:#b3261e;--defer:#8a6d00;--accent:#2f5d50}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--card:#1d2321;--ink:#e8ece9;--mute:#9aa49f;--line:#323a36;--pass:#4cc38a;--fail:#ff8a80;--defer:#e0c050;--accent:#8fc9b5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:16px}.mute{color:var(--mute)}.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;margin:0;max-height:62vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{color:var(--mute);width:42%}
td code{font:12.5px ui-monospace,Menlo,monospace}
.keys{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.keys button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.keys button.on.pass{background:var(--pass);color:#fff;border-color:var(--pass)}.keys button.on.fail{background:var(--fail);color:#fff;border-color:var(--fail)}.keys button.on.defer{background:var(--defer);color:#fff;border-color:var(--defer)}
textarea{width:100%;min-height:80px;margin-top:10px;font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.meta{font-size:13px;margin-bottom:8px}.tag{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--line);margin-right:6px;font-size:12px}
@media (max-width:800px){main{grid-template-columns:1fr}}
</style></head><body>
<header><b>Fernhill trace review</b><span class="mute" id="where"></span><div class="bar"><i id="prog"></i></div><span id="count"></span></header>
<main><section><h2>The signed lease</h2><pre id="lease"></pre></section>
<section><h2>What the abstractor wrote</h2><div class="meta" id="meta"></div><table id="abs"></table>
<div class="keys" id="keys"></div><textarea id="note" placeholder="Describe what went wrong, not why. Saved as you type." hidden></textarea>
<p class="mute" id="help"></p></section></main>
<script>
// The review state from the server, and the position of the trace on screen.
let state;
let current = 0;

const MONEY_FIELDS = ["monthly_rent", "deposit", "pet_fee", "early_termination_fee"];
const MARK_KEYS = [
  ["1", "pass"],
  ["2", "fail"],
  ["d", "defer"],
];

function element(id) {
  return document.getElementById(id);
}

function formatValue(field, value) {
  if (MONEY_FIELDS.includes(field) && typeof value === "number") {
    const dollars = (value / 100).toLocaleString("en-US", { minimumFractionDigits: 2 });
    return `$${dollars}`;
  }
  return JSON.stringify(value);
}

async function load() {
  const response = await fetch("/api/state");
  state = await response.json();
  draw();
}

// The server reads snake_case keys, so the body is built from pairs, not an object literal.
function save(item, field, value) {
  const pairs = [
    ["trace_id", item.trace.trace_id],
    [field, value],
  ];
  const body = JSON.stringify(Object.fromEntries(pairs));
  return fetch("/api/save", { method: "POST", body });
}

function isDone(item) {
  if (state.notes_mode) {
    return Boolean(item.note);
  }
  return Boolean(item.mark) && item.mark !== "defer";
}

function drawProgress() {
  const total = state.items.length;
  const done = state.items.filter(isDone).length;
  element("where").textContent = state.folder;
  element("count").textContent = `${current + 1} of ${total} · ${done} done`;
  element("prog").style.width = `${(100 * done) / total}%`;
}

function drawAbstract(item) {
  const trace = item.trace;
  element("lease").textContent = item.lease;
  element("meta").innerHTML = [
    trace.trace_id,
    trace.lease_id,
    trace.lease_type,
    `amendments: ${trace.amendments}`,
  ]
    .map((tag) => `<span class="tag">${tag}</span>`)
    .join("");
  const rows = Object.entries(trace.output).map(
    ([field, value]) =>
      `<tr><td>${field}</td><td><code>${formatValue(field, value)}</code></td></tr>`,
  );
  element("abs").innerHTML = rows.join("");
}

function drawNoteBox(item) {
  const noteBox = element("note");
  element("keys").innerHTML = "";
  noteBox.hidden = false;
  noteBox.value = item.note;
  noteBox.focus();
  element("help").textContent =
    "Notes: one note per failed trace. Tab out of the box, then use the arrow keys to move.";
}

function drawMarkButtons(item) {
  element("note").hidden = true;
  const buttons = MARK_KEYS.map(([key, mark]) => {
    const chosen = item.mark === mark ? "on" : "";
    return `<button class="${mark} ${chosen}" onclick="setMark('${mark}')">${key} ${mark}</button>`;
  });
  element("keys").innerHTML = buttons.join("");
  element("help").textContent =
    "Keys: 1 pass, 2 fail, d defer, arrows to move. Saved to marks.csv on every key.";
}

function draw() {
  const item = state.items[current];
  if (!item) {
    return;
  }
  drawProgress();
  drawAbstract(item);
  if (state.notes_mode) {
    drawNoteBox(item);
  } else {
    drawMarkButtons(item);
  }
}

// Called from the buttons' onclick, so it stays a global function.
async function setMark(mark) {
  const item = state.items[current];
  item.mark = mark;
  await save(item, "mark", mark);
  if (current < state.items.length - 1) {
    current++;
  }
  draw();
}

// Save a note 300 milliseconds after the typing stops, not on every key.
let noteTimer;
element("note").addEventListener("input", () => {
  const item = state.items[current];
  item.note = element("note").value;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => save(item, "note", item.note), 300);
});

function moveBy(step) {
  current = Math.min(Math.max(current + step, 0), state.items.length - 1);
  draw();
}

document.addEventListener("keydown", (event) => {
  if (event.target.tagName === "TEXTAREA") {
    return;
  }
  if (event.key === "ArrowRight") {
    moveBy(1);
    return;
  }
  if (event.key === "ArrowLeft") {
    moveBy(-1);
    return;
  }
  if (state.notes_mode) {
    return;
  }
  const pressed = event.key.toLowerCase();
  const match = MARK_KEYS.find(([key]) => key === pressed);
  if (match) {
    setMark(match[1]);
  }
});

load();
</script></body></html>
